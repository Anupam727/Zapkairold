    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Premium design system */
        :root { color-scheme: light; }
        body { background: #f5f7f8; letter-spacing: -.012em; }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #34d399; outline-offset: 2px; }
        .premium-hero { background: radial-gradient(circle at 85% 12%, rgba(52,211,153,.25), transparent 35%),linear-gradient(125deg,#0b1720,#12382f 72%,#075e48); color: white; border-radius: 26px; position:relative; overflow:hidden; }
        .premium-hero:after { content:'✦'; position:absolute; right:5%; top:4%; font-size:150px; color:rgba(255,255,255,.055); pointer-events:none; }

        .premium-surface { box-shadow: 0 12px 36px rgba(15,23,42,.055); }
        #appContainer .rounded-2xl { border-radius: 20px; }
        #appContainer .shadow-sm { box-shadow: 0 8px 25px rgba(15,23,42,.045); }
        #appContainer .group:hover { transform:translateY(-3px); box-shadow:0 16px 32px rgba(15,23,42,.10); }

        @media (max-width:767px) { #appContainer { padding-bottom: 100px; } nav { padding-bottom: max(8px, env(safe-area-inset-bottom)); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        body { background:#f6f8f7; }
        button, input, select, textarea { touch-action: manipulation; }
        .rounded-2xl { border-radius:1.25rem; }
        .shadow-sm { box-shadow:0 5px 22px rgba(12,35,29,.045); }
        #appContainer { scroll-behavior:smooth; }
        button:focus-visible, input:focus-visible { outline:3px solid #6ee7b7;outline-offset:2px; }
        @media(max-width:767px){nav.md\:hidden{padding-bottom:max(8px,env(safe-area-inset-bottom));}#appContainer{padding-bottom:105px;}}
    
/* Zapkair premium messenger */
.zk-chat-shell{background:#fff;border:1px solid #e8edf0}
.zk-chat-header{background:linear-gradient(110deg,#fff 0%,#f1fcf7 100%);border-bottom:1px solid #e5f0e9;box-shadow:0 3px 15px #153b2c08}
.zk-round{width:39px;height:39px;display:grid;place-items:center;border-radius:50%;color:#1e293b;transition:background .2s}.zk-round:hover{background:#e8f5ef}
.zk-avatar{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:17px;background:linear-gradient(145deg,#10b981,#0f766e);color:white;box-shadow:0 5px 14px #05966935}.zk-online-dot{position:absolute;right:-2px;bottom:-2px;background:#34d399;width:12px;height:12px;border:2px solid white;border-radius:50%}
.zk-chat-canvas{background:radial-gradient(circle at 20% 15%,#e9f8f0 0,transparent 42%),radial-gradient(circle at 85% 85%,#edf6ff 0,transparent 42%),#f8fafc;scroll-behavior:smooth}
.zk-chat-day{text-align:center;margin:0 0 20px}.zk-chat-day span{display:inline-block;padding:5px 15px;border-radius:99px;background:#fff;border:1px solid #e8edf0;color:#94a3b8;font-size:10px;font-weight:700;box-shadow:0 2px 8px #0f172a08}
.zk-chat-empty{text-align:center;max-width:260px;margin:55px auto;padding:30px 20px;border-radius:24px;background:#ffffffba;color:#64748b;border:1px solid #fff;box-shadow:0 12px 30px #0f172a08}.zk-chat-empty h4{color:#0f172a}
.zk-message-row{display:flex;position:relative;align-items:center;max-width:100%}.zk-mine{justify-content:flex-end}.zk-theirs{justify-content:flex-start}.zk-message-wrap{max-width:min(83%,420px);min-width:75px;transform:translateX(var(--swipe-x,0px));transition:transform .16s ease-out}.zk-message-bubble{padding:11px 13px;border-radius:19px;box-shadow:0 3px 12px #0f172a0c;overflow-wrap:anywhere}.zk-mine .zk-message-bubble{background:linear-gradient(135deg,#10b981,#047857);color:white;border-bottom-right-radius:5px}.zk-theirs .zk-message-bubble{background:#fff;color:#17212b;border:1px solid #e9eef2;border-bottom-left-radius:5px}.zk-message-time{font-size:10px;opacity:.65;text-align:right;margin-top:5px}.zk-quoted{font-size:11px;padding:8px;margin-bottom:8px;border-left:3px solid #6ee7b7;background:#ffffff24;border-radius:7px;max-height:65px;overflow:hidden}.zk-theirs .zk-quoted{background:#f1f5f9;color:#475569}.zk-unsent{background:#eef2f4!important;color:#64748b!important;border:1px dashed #cbd5e1!important}.zk-message-actions{display:flex;gap:2px;opacity:.55;align-self:center}.zk-message-actions button{padding:9px;color:#64748b;border-radius:50%;font-size:12px}.zk-message-actions button:hover{background:#d1fae5;color:#047857}.zk-swipe-hint{position:absolute;left:5px;color:#059669;opacity:.65}.zk-composer-wrap{background:#fff;border-top:1px solid #e9eff2;box-shadow:0 -8px 24px #0f172a06}.zk-composer{display:flex;gap:9px;align-items:flex-end;padding:7px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:25px}.zk-attach{width:39px;height:39px;flex-shrink:0;display:grid;place-items:center;color:#059669;border-radius:50%;cursor:pointer;font-size:19px}.zk-attach:hover{background:#dcfce7}.zk-input{background:transparent;outline:0;resize:none;flex:1;min-width:0;max-height:120px;padding:10px 0;font-size:14px;line-height:20px}.zk-send{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#10b981,#047857);color:#fff;box-shadow:0 4px 12px #05966955;transition:transform .15s}.zk-send:active{transform:scale(.9)}.zk-reply-preview{align-items:center;gap:10px;padding:11px 13px;background:#ecfdf5;border-left:3px solid #059669;border-radius:12px;margin-bottom:9px;font-size:12px;color:#334155}.zk-reply-preview:not(.hidden){display:flex}
@media(hover:none){.zk-message-actions{opacity:.8}}
@media(max-width:767px){body:has(#chatInputBox) nav.md\:hidden{display:none!important}body:has(#chatInputBox) #appContainer{padding-bottom:0!important}body:has(#chatInputBox) .zk-chat-shell{height:calc(100dvh - 62px)!important;min-height:0}#chatInputBox{font-size:16px!important;touch-action:manipulation;user-select:text!important;-webkit-user-select:text!important}.zk-composer-wrap{padding-bottom:max(10px,env(safe-area-inset-bottom))!important}}

/* V21: polished confirmation dialogs, balanced detail chips, premium touch targets */
.zk-confirm-backdrop{position:fixed;inset:0;z-index:120;background:rgba(8,20,16,.58);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px;animation:zkFadeIn .16s ease-out}
.zk-confirm-card{width:min(100%,390px);background:#fff;border:1px solid #e4eee8;border-radius:26px;padding:24px;box-shadow:0 28px 90px rgba(0,0,0,.24);animation:zkRise .2s ease-out}
.zk-confirm-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:18px;background:#fff1f2;color:#e11d48;font-size:21px;margin-bottom:16px}
.zk-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.zk-confirm-cancel,.zk-confirm-accept{min-height:46px;border-radius:14px;font-size:13px;font-weight:800;padding:10px 14px}
.zk-confirm-cancel{background:#f1f5f3;color:#334155}.zk-confirm-accept{background:linear-gradient(135deg,#10b981,#047857);color:white;box-shadow:0 5px 14px #05966925}.zk-confirm-accept.danger{background:linear-gradient(135deg,#f43f5e,#be123c);box-shadow:0 5px 14px #e11d4825}
.zk-detail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;min-width:0}.zk-condition-pill{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:7px 11px;border-radius:999px;background:#d1fae5;color:#065f46;font-size:11px;font-weight:800;line-height:1.25}.zk-location-pill{display:inline-flex;align-items:flex-start;gap:7px;min-width:0;max-width:100%;padding:7px 11px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:999px;color:#475569;font-size:11px;font-weight:650;line-height:1.35;overflow-wrap:anywhere}.zk-location-pill i{color:#059669;margin-top:1px;flex-shrink:0}.zk-location-pill span{min-width:0;white-space:normal}
.zk-detail-action{min-height:46px;border-radius:14px;font-weight:800;transition:transform .15s,box-shadow .15s}.zk-detail-action:active{transform:scale(.98)}
.zk-safety-note{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1px solid #dbece3;border-radius:16px;background:linear-gradient(120deg,#f0fdf7,#f8fbff);color:#475569;font-size:11px;line-height:1.55}
@keyframes zkFadeIn{from{opacity:0}to{opacity:1}}@keyframes zkRise{from{opacity:.7;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){.zk-confirm-card{padding:21px;border-radius:23px}.zk-detail-meta{gap:8px}.zk-location-pill{border-radius:14px;flex:1 1 100%;width:100%}}

/* V31 premium hierarchy, listing review states and actionable notifications */
.zk-highlight-text{background:linear-gradient(100deg,#047857,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
.zk-review-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:850;letter-spacing:.025em;text-transform:uppercase}
.zk-review-pending{background:#fff7df;color:#925c00;border:1px solid #f8df9c}.zk-review-rejected{background:#fff0f0;color:#b42318;border:1px solid #ffd5d5}.zk-review-active{background:#e8fbf2;color:#087443;border:1px solid #b9efd2}
.zk-notification-delete{border:1px solid #e5e7eb;background:#fff;color:#64748b;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;flex-shrink:0}.zk-notification-delete:hover{background:#fff1f2;color:#be123c;border-color:#fecdd3}
.zk-premium-heading{font-weight:900;letter-spacing:-.035em;line-height:1.12}
/* V20: notification center and legal footer */
.zk-notification-item{display:flex;gap:12px;padding:14px;border-bottom:1px solid #edf2f0;align-items:flex-start}.zk-notification-item.unread{background:#f0fdf7}.zk-notification-icon{width:38px;height:38px;flex-shrink:0;border-radius:13px;background:#d1fae5;color:#047857;display:grid;place-items:center}.zk-footer{padding:22px 16px 30px;text-align:center;color:#94a3b8;font-size:11px;border-top:1px solid #e8eeeb;margin-top:28px}.zk-footer strong{color:#64748b;font-weight:800}
/* V16: consistent app rhythm and inbox indicators */
:root{--zk-space:16px;--zk-radius:18px}
#appContainer{min-height:55vh}#appContainer button{touch-action:manipulation}#appContainer .rounded-2xl{border-radius:var(--zk-radius)}
.zk-inbox-row{min-height:84px;gap:12px;padding:15px 16px;transition:background .15s ease}.zk-inbox-row:active{background:#f0fdf4}
.zk-unread-dot{width:10px;height:10px;min-width:10px;background:#10b981;border-radius:50%;box-shadow:0 0 0 4px #d1fae5}
.zk-unread-pill{min-width:21px;height:21px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#059669;color:#fff;font-size:11px;font-weight:800}
.zk-inbox-sub{min-width:0;flex:1}.zk-inbox-sub p,.zk-inbox-sub h4{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){#appContainer .max-w-3xl{max-width:100%}.zk-inbox-row{padding:13px 14px}.zk-chat-shell{border-radius:0!important;border-left:0;border-right:0}.zk-chat-header{gap:10px}.zk-message-bubble{overflow-wrap:anywhere}}

:root{--zk-green:#069b57;--zk-ink:#06241e;--zk-line:#e4ebe8}
body{background:#f4f8f7!important;color:#102b26}

        window.calculateDistance = function(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c * 10) / 10; // Distance in km
        };

            const filtered = (window.appState.listings || []).filter(item => {
                if(String(item.status||'active').toLowerCase()!=='active')return false;
                if(item.ownerId && item.ownerId===auth?.currentUser?.uid)return false;
                const hasItemCoords = item.lat !== null && item.lat !== undefined && item.lng !== null && item.lng !== undefined && Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lng));
                if (hasUserCoords && hasItemCoords) {
                    const dist = calculateDistance(Number(userLoc.lat), Number(userLoc.lng), Number(item.lat), Number(item.lng));
                    item.distance = dist;
                    if (dist > (userLoc.radiusKm || 50)) return false;
                } else {
                    item.distance = null; // don't suppress listings just because GPS data is missing
                }
                if (window.appState.selectedBrand !== 'All' && item.brand !== window.appState.selectedBrand) return false;
                if (window.appState.selectedCondition !== 'All' && item.condition !== window.appState.selectedCondition) return false;
                const searchText = `${item.brand || ''} ${item.model || ''}`.toLowerCase();
                if (window.appState.searchQuery && !searchText.includes(String(window.appState.searchQuery).toLowerCase())) return false;
                const price = Number(item.price || 0);
                if (price < Number(window.appState.priceRange.min || 0) || price > Number(window.appState.priceRange.max || 200000)) return false;
                return true;

        function renderChatRoomView(chatId) {
          const chat=(appState.chats||[]).find(c=>c.id===chatId);
          if(!chat)return `<div class="p-8">Chat not found <button onclick="router.navigate('chats')">Back</button></div>`;
          const messages=visibleChatMessages(chatId);
          const role=chatRole(chat);
          const safeId=JSON.stringify(chatId).replace(/"/g,'&quot;');
          const myId=appState.user?.uid||'current-user';
          return `<div class="zk-chat-shell max-w-3xl mx-auto flex flex-col h-[calc(100dvh-128px)] md:h-[calc(100dvh-105px)] md:my-3 md:rounded-[28px] overflow-hidden shadow-xl">
            <header class="zk-chat-header flex items-center gap-3 px-3 sm:px-5 py-3 shrink-0">
              <button onclick="router.navigate('chats')" aria-label="Back" class="zk-round"><i class="fa-solid fa-arrow-left"></i></button>

              <div class="flex-1 min-w-0"><h3 class="font-extrabold truncate text-[15px]">${escapeHTML(otherChatName(chat))}</h3><p class="text-[11px] text-emerald-600 font-medium">${role==='sell'?'Selling enquiry':'Buying enquiry'} · ${escapeHTML(chat.listingTitle||'Private conversation')}</p></div>
              <button onclick="openChatMenu(${safeId})" class="zk-round" aria-label="Chat options"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </header>
            <div id="chatMessagesBox" class="zk-chat-canvas flex-1 min-h-0 overflow-y-auto px-3 sm:px-5 py-5 space-y-3" aria-live="polite">
              <div class="zk-chat-day"><span>Today</span></div>
              ${messages.length?'':`<div class="zk-chat-empty"><i class="fa-regular fa-comments text-3xl mb-3 text-emerald-600"></i><h4 class="font-bold">Start something great</h4><p class="text-xs mt-1">Say hello or ask about this listing</p></div>`}
              ${messages.map((m,i)=>{const mine=m.senderId===myId||m.senderId==='current-user';const ref=messages.find(x=>x.id===m.replyTo);return `<div class="zk-message-row ${mine?'zk-mine':'zk-theirs'}" data-message-index="${i}" data-chat-id="${escapeHTML(chatId)}">
                <div class="zk-swipe-hint"><i class="fa-solid fa-reply"></i></div>
                <div class="zk-message-wrap">${!mine?`<div class="text-[11px] font-semibold text-emerald-700 mb-1 ml-2">${escapeHTML(m.senderName||otherChatName(chat))}</div>`:``}<div class="zk-message-bubble ${m.unsent?'zk-unsent':''}">
                  ${ref?`<div class="zk-quoted">${ref.unsent?'Message unsent':ref.image?'📷 Photo':escapeHTML(ref.text||'Message unavailable')}</div>`:''}
                  ${m.unsent?`<p class="text-sm italic opacity-75"><i class="fa-solid fa-ban mr-1"></i>Message unsent</p>`:`${m.image?`<button onclick="openChatPhoto(${safeId},${i})" class="block" aria-label="View photo"><img draggable="false" oncontextmenu="return false" src="${m.image}" alt="Shared photo" class="rounded-2xl max-h-72 max-w-full object-contain" /></button>`:''}${m.text?`<p class="text-sm whitespace-pre-wrap leading-relaxed">${escapeHTML(m.text)}</p>`:''}`}
                  <div class="zk-message-time">${escapeHTML(m.time||'')} ${mine&&!m.unsent?'<i class="fa-solid fa-check-double ml-1"></i>':''}</div>
                </div><div class="zk-message-actions"><button onclick="replyToChatMessage(${safeId},${i})" title="Reply" aria-label="Reply"><i class="fa-solid fa-reply"></i></button>${mine&&!m.unsent?`<button onclick="unsendChatMessage(${safeId},${i})" title="Unsend" aria-label="Unsend"><i class="fa-solid fa-trash-can"></i></button>`:''}</div></div>
              </div>`}).join('')}
            </div>
            <div class="zk-composer-wrap shrink-0 px-3 sm:px-5 pt-3 pb-4">
              <div id="replyPreview" class="hidden zk-reply-preview"><i class="fa-solid fa-reply text-emerald-600"></i><span class="flex-1 truncate" id="replyPreviewText"></span><button onclick="cancelChatReply()" aria-label="Cancel reply"><i class="fa-solid fa-xmark"></i></button></div>
              <div class="zk-composer"><label title="Send photo" class="zk-attach"><i class="fa-regular fa-image"></i><input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="sendChatPhoto(event,${safeId})" /></label>
              <textarea id="chatInputBox" enterkeyhint="send" autocomplete="off" rows="1" maxlength="3000" placeholder="Write a message..." class="zk-input" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage(${safeId})}"></textarea>
              <button onclick="sendChatMessage(${safeId})" aria-label="Send message" class="zk-send"><i class="fa-solid fa-arrow-up"></i></button></div>
              <p class="text-center text-[10px] text-slate-400 mt-2">Swipe a message right to reply · Tap trash to unsend</p>
            </div></div>`;
        }

        const zapPatternTranslations=[
          [/^Showing (\d+) listings within (\d+)km of (.+)$/,'$3 से $2 किमी के अंदर $1 विज्ञापन'],
          [/^Within 50 km of (.+)$/,'$1 से 50 किमी के अंदर'],

          [/^Showing (\d+) listings$/,'$1 विज्ञापन दिखाए जा रहे हैं']
        ];
        function zapTranslate(str){
          if(zapTranslations[str])return zapTranslations[str];
          for(const [pattern,replacement] of zapPatternTranslations){if(pattern.test(str))return str.replace(pattern,replacement)}
          return str;
        }
        let zapApplying=false;
        window.applyZapkairLanguage=function(){
          if(zapApplying)return;
          zapApplying=true;
          try{
            const hi=localStorage.getItem('zapkair_language')==='hi';
            document.documentElement.lang=hi?'hi':'en';
            const roots=['appContainer','modalContainer','toastContainer','desktopAuthNav'];
            roots.forEach(id=>{
              const root=document.getElementById(id);if(!root)return;
              const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
              const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
              nodes.forEach(node=>{
                if(!node.parentElement||node.parentElement.closest('script,style,textarea,option,[data-no-translate],.chat-message,.message-bubble'))return;
                const raw=node.textContent,trimmed=raw.trim();if(!trimmed)return;
                const english=node.__zapEnglish||trimmed;
                if(!node.__zapEnglish)node.__zapEnglish=english;
                const translated=hi?zapTranslate(english):english;
                if(translated!==trimmed)node.textContent=raw.replace(trimmed,translated);
              });
              root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{
                const original=el.dataset.originalPlaceholder||el.getAttribute('placeholder');
                if(!el.dataset.originalPlaceholder)el.dataset.originalPlaceholder=original;
                const target=hi?zapTranslate(original):original;
                if(el.placeholder!==target)el.placeholder=target;
              });
              root.querySelectorAll('option').forEach(el=>{
                const en=el.dataset.zapEnglish||el.textContent.trim();
                if(!el.dataset.zapEnglish)el.dataset.zapEnglish=en;
                const target=hi?zapTranslate(en):en;
                if(el.textContent.trim()!==target)el.textContent=target;
              });
            });
            document.querySelectorAll('nav button span').forEach(el=>{
              const en=el.dataset.originalText||el.textContent.trim();
              if(!el.dataset.originalText)el.dataset.originalText=en;

            });

        // Compress photos before uploading; store URLs in Firestore, never large base64 blobs.
        async function compressPhoto(file, maxDimension=1440, quality=.76) {
            if (!file.type.startsWith('image/')) throw new Error('Please select an image');
            if (file.size > 20*1024*1024) throw new Error('Image must be under 20 MB');
            const bitmap=await createImageBitmap(file);
            try {
                const scale=Math.min(1,maxDimension/Math.max(bitmap.width,bitmap.height));
                const canvas=document.createElement('canvas');
                canvas.width=Math.max(1,Math.round(bitmap.width*scale));
                canvas.height=Math.max(1,Math.round(bitmap.height*scale));
                canvas.getContext('2d',{alpha:false}).drawImage(bitmap,0,0,canvas.width,canvas.height);
                const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
                if (!blob) throw new Error('Image compression failed');
                return blob;
            } finally { bitmap.close(); }
        }
        async function uploadListingPhotos(files, listingId, ownerId) {
            if (!files?.length) return [];
            if (!storage) throw new Error('Firebase Storage is not available');
            const uploaded=[];
            try {
                for (let i=0;i<files.length;i++) {
                    const blob=await compressPhoto(files[i]);
                    const path=`listingImages/${ownerId}/${listingId}/${Date.now()}_${i}.jpg`;
                    const ref=storageRef(storage,path);
                    await uploadBytes(ref,blob,{contentType:'image/jpeg',customMetadata:{listingId,ownerId}});
                    uploaded.push({path,url:await getDownloadURL(ref)});
                }
                return uploaded;
            } catch(error) {
                await Promise.allSettled(uploaded.map(item=>deleteObject(storageRef(storage,item.path))));
                throw error;
            }
        }
        async function deleteStoredPhotos(paths) {
            if (!storage || !paths?.length) return;
            const results=await Promise.allSettled(paths.filter(path=>typeof path==='string'&&path.startsWith('listingImages/')).map(path=>deleteObject(storageRef(storage,path))));
            const failed=results.find(r=>r.status==='rejected'&&r.reason?.code!=='storage/object-not-found');
            if (failed) throw failed.reason;
        }

            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', id));
            } catch(e) { showToast('Delete failed: '+(e.message||'Please try again.'),'error'); return; }
            try { await deleteStoredPhotos(listing.imagePaths||[]); }
            catch(e) { console.warn('Photo cleanup failed',e); showToast('Ad deleted, but some photos could not be removed from Storage.','error'); }
            window.appState.listings = window.appState.listings.filter(l => l.id !== id);
            window.appState.myAds = window.appState.myAds.filter(l => l.id !== id);
            persistAppState();
            try{await createUserNotification(auth.currentUser.uid,{type:'ad-deleted',title:'Ad deleted',body:`${listing.brand||''} ${listing.model||'Your ad'} has been deleted.`});}catch(notificationError){console.warn('Ad deleted; notification unavailable:',notificationError)}
            showToast('Your ad has been deleted.');
            router.render();
        };

        window.handleAuthSubmit = function(event, mode) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const name = document.getElementById('authName') ? document.getElementById('authName').value : 'Zapkair User';

            if (!email || password.length < 6) {
                showToast('Enter a valid email and a password with at least 6 characters.', 'error');
                return;
            }
            if (isFirebaseInitialized && !isDemoMode && auth) {
                const operation = mode === 'login'
                    ? signInWithEmailAndPassword(auth, email, password)
                    : createUserWithEmailAndPassword(auth, email, password).then(async cred => {
                        await updateProfile(cred.user, { displayName: name });
                        return cred;
                    });
                operation.then(cred => {
                    window.appState.user = cred.user;
                    persistAppState();
                    showToast(mode === 'login' ? 'Signed in successfully!' : 'Account created successfully!');
                    router.navigate('home');
                }).catch(err => showToast(friendlyAppError(err, 'Login nahi ho paaya. Dobara try karein.'), 'error'));
                return;
            }
            showToast('Login service abhi available nahi hai. Thodi der baad try karein.', 'error');
        };

        window.showConfirmDialog = function({title='Are you sure?', message='Do you want to continue?', confirmText='Confirm', cancelText='Cancel', danger=false, icon='fa-circle-question', onConfirm=()=>{}} = {}) {
            const host=document.getElementById('modalContainer');
            if(!host)return;
            window.__zapkairConfirmAction=onConfirm;
            host.innerHTML=`<div class="zk-confirm-backdrop" role="presentation" onclick="if(event.target===this)closeConfirmDialog()"><section class="zk-confirm-card" role="dialog" aria-modal="true" aria-labelledby="zkConfirmTitle"><div class="zk-confirm-icon ${danger?'':'!bg-emerald-50 !text-emerald-700'}"><i class="fa-solid ${icon}"></i></div><h2 id="zkConfirmTitle" class="text-xl font-extrabold text-slate-900 tracking-tight">${escapeHTML(title)}</h2><p class="text-sm text-slate-500 leading-relaxed mt-2">${escapeHTML(message)}</p><div class="zk-confirm-actions"><button type="button" class="zk-confirm-cancel" onclick="closeConfirmDialog()">${escapeHTML(cancelText)}</button><button type="button" class="zk-confirm-accept ${danger?'danger':''}" onclick="runConfirmDialogAction()">${escapeHTML(confirmText)}</button></div><p class="text-[10px] text-slate-400 text-center mt-4"><i class="fa-solid fa-shield-halved mr-1"></i> Your account and saved data stay protected.</p></section></div>`;
            const cancel=host.querySelector('.zk-confirm-cancel'); if(cancel)cancel.focus();
        };
        window.closeConfirmDialog = function(){const host=document.getElementById('modalContainer');if(host)host.innerHTML='';window.__zapkairConfirmAction=null;};
        window.runConfirmDialogAction = async function(){const action=window.__zapkairConfirmAction;window.__zapkairConfirmAction=null;const host=document.getElementById('modalContainer');if(host)host.innerHTML='';if(typeof action==='function')await action();};

        window.handleLogout = function() {
            if (!window.appState.user && !auth?.currentUser) { window.openLoginSheet(); return; }
            window.showConfirmDialog({
                title: 'Log out of Zapkair?',
                message: 'Are you sure you want to log out from this device? Your ads and conversations will remain saved to your account.',
                confirmText: 'Yes, log out',
                cancelText: 'Stay logged in',
                danger: false,
                icon: 'fa-right-from-bracket',
                onConfirm: performLogout
            });
        };

        async function performLogout() {
            try {
                if (isFirebaseInitialized && !isDemoMode && auth?.currentUser) await signOut(auth);
                window.appState.user = null;
                persistAppState();
                showToast('You have been logged out.');
                router.navigate('home');
            } catch (err) {
                console.error('Logout failed:', err);
                showToast('Could not log out. Please try again.', 'error');
            }
        };

    
        window.zkSlideIndex=0;
        window.zkSetSlide=function(index){
          const track=document.getElementById('zkCarouselTrack');if(!track)return;
          const slideCount=track.children.length||4;const n=((index%slideCount)+slideCount)%slideCount;window.zkSlideIndex=n;
          track.style.transform='translateX(-'+(n*100)+'%)';
          document.querySelectorAll('.zk-carousel-dot').forEach((dot,i)=>{dot.classList.toggle('active',i===n);dot.setAttribute('aria-current',i===n?'true':'false')});
        };
        window.zkPauseCarousel=function(paused){window.zkCarouselPaused=paused};
        window.zkToggleFilters=function(force){
          const panel=document.getElementById('zkExploreFilters');if(!panel)return;
          const open=typeof force==='boolean'?force:panel.style.display==='none';
          panel.style.display=open?'block':'none';
          const arrow=document.getElementById('zkFilterChevron');if(arrow)arrow.className='fa-solid '+(open?'fa-chevron-up':'fa-chevron-down');
          if(open)panel.scrollIntoView({behavior:'smooth',block:'nearest'});
        };
        window.zkOpenFilters=()=>window.zkToggleFilters(true);
        // A single interval for the app lifetime; hidden tabs and active interactions pause sliding.
        if(!window.zkCarouselInterval)window.zkCarouselInterval=setInterval(()=>{
          if(!document.hidden&&!window.zkCarouselPaused&&document.getElementById('zkCarouselTrack'))window.zkSetSlide((window.zkSlideIndex||0)+1);
        },4800);
</script>
</body>
</html>
